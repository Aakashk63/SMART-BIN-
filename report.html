<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Uplink - SmartBin AI</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-cube"></i> SMARTBIN<span class="text-glow-blue">AI</span>
            </a>
            <div class="sys-status">
                <div class="blinker"></div> SYSTEM ONLINE
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Interface</a></li>
                <li><a href="report.html" class="active">Data Uplink</a></li>
                <li><a href="dashboard.html">Core HUD</a></li>
            </ul>
        </div>
    </nav>

    <!-- Report Form Page -->
    <section class="container" style="position: relative; z-index: 10;">
        <div class="form-container glass-panel">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <h2 class="mono text-glow-blue" style="font-size: 1.75rem; margin-bottom: 0.5rem;"><i class="fa-solid fa-satellite-dish"></i> MANUAL DATA UPLINK</h2>
                <p class="text-muted mono" style="font-size: 0.875rem;">TRANSMIT CROWDSOURCED BIN TELEMETRY</p>
            </div>
            
            <form id="report-form" action="#">
                <!-- Location Field -->
                <div class="form-group">
                    <label class="form-label mono text-glow-blue" for="location" style="font-size: 0.875rem;">TARGET COORDINATES</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="location" class="form-control" placeholder="Awaiting input..." required>
                        <button type="button" id="locate-btn" class="btn btn-secondary mono" style="white-space: nowrap; padding: 0.5rem 1rem;">
                            <i class="fa-solid fa-crosshairs"></i> SYNC
                        </button>
                    </div>
                </div>

                <!-- Image Upload (Drag & Drop) -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.5rem;">
                        <label class="form-label mono text-glow-blue" style="font-size: 0.875rem; margin:0;">VISUAL DATA</label>
                        <span class="mono" style="color: var(--neon-purple); font-size: 0.75rem; text-shadow: 0 0 5px rgba(124,58,237,0.5);"><i class="fa-solid fa-microchip"></i> AI AUTO-SCAN ENABLED</span>
                    </div>
                    <div class="upload-area" id="upload-area">
                        <i class="fa-solid fa-camera upload-icon text-muted"></i>
                        <p class="mono text-muted" style="font-size: 0.875rem; margin-bottom: 0.25rem;">[ CLICK OR DRAG IMAGE FILE HERE ]</p>
                        <p class="mono text-muted" style="font-size: 0.75rem; opacity: 0.5;">JPG, PNG MAX 5MB</p>
                    </div>
                </div>

                <!-- Status Selection -->
                <div class="form-group">
                    <label class="form-label mono text-glow-blue" for="status" style="font-size: 0.875rem;">OVERRIDE STATUS (OPTIONAL)</label>
                    <select id="status" class="form-control" required style="cursor: pointer; appearance: none;">
                        <option value="" disabled selected>AWAITING NEURAL PREDICTION...</option>
                        <option value="full">🔴 CRITICAL [FULL]</option>
                        <option value="half">🟡 WARNING [HALF]</option>
                        <option value="empty">🟢 NOMINAL [EMPTY]</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 3rem;">
                    <button type="submit" class="btn btn-primary btn-block mono" style="font-size: 1.125rem; padding: 1.25rem;">
                        <i class="fa-solid fa-upload"></i> INITIATE TRANSMISSION
                    </button>
                </div>
            </form>
        </div>
    </section>

    <script src="assets/js/scripts.js"></script>
</body>
</html>
