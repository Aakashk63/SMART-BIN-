<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Map - SmartBin AI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="overflow: hidden;">
    
    <div class="dashboard-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo">
                     <i class="fa-solid fa-cube"></i> SMARTBIN<span class="text-glow-blue">AI</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fa-solid fa-layer-group"></i> MAIN HUD
                </a>
                <a href="report.html" class="sidebar-link">
                    <i class="fa-solid fa-satellite-dish"></i> DATA UPLINK
                </a>
                <a href="map.html" class="sidebar-link active">
                    <i class="fa-solid fa-globe"></i> NEURAL MAP
                </a>
                <a href="map.html" class="sidebar-link">
                    <i class="fa-solid fa-network-wired"></i> OPTIMIZER
                </a>
            </nav>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(0,212,255,0.2);">
                <div class="sys-status" style="justify-content: center;">
                    <div class="blinker"></div> GRID STABLE
                </div>
            </div>
        </aside>

        <!-- Main Panel (Map) -->
        <main class="main-panel" style="padding: 0; position: relative;">
            
            <div class="map-overlay">
                <h3 class="mono text-glow-blue" style="margin-bottom: 0.5rem;"><i class="fa-solid fa-route"></i> ROUTE OPTIMIZER</h3>
                <p class="text-muted mono" style="font-size: 0.75rem; margin-bottom: 2rem;">NEURAL NET CALCULATES OPTIMAL PATHWAYS TO BYPASS EMPTY NODES.</p>
                
                <button id="optimize-btn" class="btn btn-primary btn-block mono" style="margin-bottom: 1rem;">
                    <i class="fa-solid fa-microchip"></i> INITIATE NEURAL PATH
                </button>

                <div id="route-loading-bar" style="display: none; margin-bottom: 1.5rem;">
                    <p class="mono text-glow-blue" style="font-size: 0.75rem; margin-bottom: 0.5rem;">PROCESSING WAYPOINTS...</p>
                    <div class="data-bar" style="height: 4px;">
                        <div class="data-fill" style="width: 0%; transition: width 0.3s;"></div>
                    </div>
                </div>

                <div id="route-stats" style="display: none; opacity: 0; transition: opacity 0.5s;">
                    <h4 class="mono" style="font-size: 0.75rem; color: var(--neon-blue); margin-bottom: 1rem; border-bottom: 1px solid rgba(0,212,255,0.2); padding-bottom: 0.5rem;">OPTIMIZATION TELEMETRY</h4>
                    
                    <div class="hud-stat-row">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <i class="fa-solid fa-road text-glow-blue" style="font-size: 1.25rem;"></i>
                            <div>
                                <p class="mono text-muted" style="font-size: 0.65rem;">DISTANCE SAVED</p>
                                <p class="mono" style="font-weight: 700;">14.2 KM</p>
                            </div>
                        </div>
                    </div>

                    <div class="hud-stat-row">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <i class="fa-solid fa-gas-pump text-glow-green" style="font-size: 1.25rem; color: var(--neon-green);"></i>
                            <div>
                                <p class="mono text-muted" style="font-size: 0.65rem;">FUEL SAVED</p>
                                <p class="mono" style="font-weight: 700; color: var(--neon-green);">4.5 L</p>
                            </div>
                        </div>
                    </div>

                    <div class="hud-stat-row">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <i class="fa-solid fa-clock text-glow-yellow" style="font-size: 1.25rem; color: var(--neon-yellow);"></i>
                            <div>
                                <p class="mono text-muted" style="font-size: 0.65rem;">TIME REDUCED</p>
                                <p class="mono" style="font-weight: 700; color: var(--neon-yellow);">1h 15m</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Leaflet Map Container -->
            <div id="map" class="map-container"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="assets/js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Leaflet Map
            const map = L.map('map', {
                zoomControl: false
            }).setView([12.9716, 77.5946], 14);

            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);

            // Dark Matter Base Map
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // Cyberpunk glowing markers
            const createIcon = (className) => {
                return L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${className}"></div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
            };

            const iconRed = createIcon('node-red');
            const iconYellow = createIcon('node-yellow');
            const iconGreen = createIcon('node-green');

            // Dummy bin locations
            const bins = [
                { loc: [12.9716, 77.5946], status: 'full', routeOrder: 1 },
                { loc: [12.9750, 77.5900], status: 'full', routeOrder: 2 },
                { loc: [12.9680, 77.5980], status: 'empty', routeOrder: null },
                { loc: [12.9720, 77.5850], status: 'half', routeOrder: null },
                { loc: [12.9780, 77.5890], status: 'full', routeOrder: 3 },
                { loc: [12.9650, 77.5950], status: 'full', routeOrder: 0 }, // Depot
                { loc: [12.9790, 77.6000], status: 'full', routeOrder: 4 },
                { loc: [12.9660, 77.5880], status: 'half', routeOrder: null }
            ];

            const markers = [];

            bins.forEach(bin => {
                let icon;
                let popupText;
                if(bin.status === 'full') {
                    icon = iconRed;
                    popupText = "<span class='mono' style='color:var(--neon-red);'>[CRITICAL] FULL</span><br>REQUIRE INTERCEPT";
                } else if(bin.status === 'half') {
                    icon = iconYellow;
                    popupText = "<span class='mono' style='color:var(--neon-yellow);'>[WARNING] HALF</span><br>MONITORING CAPACITY";
                } else {
                    icon = iconGreen;
                    popupText = "<span class='mono' style='color:var(--neon-green);'>[NOMINAL] EMPTY</span><br>BYPASS LOCATION";
                }

                if(bin.routeOrder === 0) {
                    popupText = "<span class='mono text-glow-blue'>[HUB] DEPOT START</span>";
                }

                const marker = L.marker(bin.loc, {icon: icon}).addTo(map)
                    .bindPopup(popupText);
                
                markers.push(marker);
            });

            // Handle glowing route polyline
            let routingLine = null;
            document.addEventListener('routeOptimized', () => {
                const routePoints = bins
                    .filter(b => b.status === 'full' || b.routeOrder === 0)
                    .sort((a, b) => a.routeOrder - b.routeOrder)
                    .map(b => b.loc);

                if (routingLine) { map.removeLayer(routingLine); }

                // Glowing neon path
                routingLine = L.polyline(routePoints, {
                    color: 'var(--neon-blue)',
                    weight: 5,
                    opacity: 0.9,
                    dashArray: '15, 10',
                    lineJoin: 'round',
                    className: 'neon-path'
                }).addTo(map);
                
                // Add CSS for path animation
                const style = document.createElement('style');
                style.innerHTML = `
                    .neon-path {
                        filter: drop-shadow(0 0 8px var(--neon-blue)) drop-shadow(0 0 12px var(--neon-blue));
                        animation: dash 30s linear infinite;
                    }
                    @keyframes dash { to { stroke-dashoffset: -1000; } }
                `;
                document.head.appendChild(style);

                map.fitBounds(routingLine.getBounds(), { padding: [50, 50] });
            });
        });
    </script>
</body>
</html>
